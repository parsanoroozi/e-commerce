spring.application.name=e-commerce-backend


## H2 (file-based — persists in ./data, no Docker required)
#spring.datasource.url=jdbc:h2:file:./data/ecommerce;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (override in production via env)
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-must-be-long-enough}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://192.168.1.100:5173

server.address=0.0.0.0
server.port=8080

app.tax.rate=0.08
app.frontend.url=http://localhost:5173,http://192.168.1.100:5173

management.endpoints.web.exposure.include=health

# File uploads (local storage)
app.storage.type=local
app.storage.upload-dir=uploads
app.storage.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Payments — demo mode when Stripe keys are empty (local dev). Set PAYMENT_DEV_MODE=false in production.
app.payment.dev-mode=${PAYMENT_DEV_MODE:true}

# Stripe — add test keys from https://dashboard.stripe.com/test/apikeys to use real checkout
stripe.api-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=usd

# Email (enable and point to MailHog/SMTP for real delivery)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@shopverse.local}
app.mail.from-name=ShopVerse
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
