spring.application.name=e-commerce-backend


## H2 (file-based — persists in ./data, no Docker required)
#spring.datasource.url=jdbc:h2:file:./data/ecommerce;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.web.pageable.max-page-size=100

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string}
app.jwt.expiration-ms=86400000
app.auth.cookie.name=SHOPVERSE_AUTH
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# CORS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://192.168.100.6:5173

server.address=0.0.0.0
server.port=8080

app.tax.rate=0.08
app.frontend.url=http://localhost:5173,http://127.0.0.1:5173,http://192.168.100.6:5173

management.endpoints.web.exposure.include=health

# Maps - optional Geoapify key improves geocoding quality; falls back to free no-key providers when empty.
app.maps.geoapify-key=${GEOAPIFY_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.personal.ecommercebackend=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger / OpenAPI (http://localhost:8080/swagger-ui/index.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# File uploads (local storage)
app.storage.type=local
app.storage.upload-dir=uploads
app.storage.max-file-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Payments — demo mode when Stripe keys are empty (local dev). Set PAYMENT_DEV_MODE=false in production.
app.payment.dev-mode=${PAYMENT_DEV_MODE:true}

# Stripe — add test keys from https://dashboard.stripe.com/test/apikeys to use real checkout
stripe.api-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=usd

# Seed data is disabled by default so demo credentials are never created accidentally.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@shop.com}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}

# Email - configure through environment variables.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@shopverse.local}
app.mail.from-name=ShopVerse
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:8025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
