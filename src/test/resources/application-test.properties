spring.datasource.url=jdbc:h2:mem:ecommerce-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-256-bit-secret-key-change-this-in-production-must-be-long-enough
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5176
app.frontend.url=http://localhost:5176
app.tax.rate=0.08
app.payment.dev-mode=true
app.mail.enabled=false
app.storage.type=local
app.storage.upload-dir=target/test-uploads
app.storage.max-file-size-bytes=5242880

stripe.api-key=
stripe.publishable-key=
stripe.webhook-secret=
stripe.currency=usd

logging.level.root=WARN
logging.level.personal.ecommercebackend=INFO
